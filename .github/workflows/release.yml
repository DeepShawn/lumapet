name: LumaPet Release

on:
  push:
    tags:
      - 'v*'
  # Manual releases: the publish job creates the tag on the dispatched commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.2.0'
        required: true

permissions:
  contents: write

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --config electron-builder.yml --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: platform/windows/release/*
          if-no-files-found: error
          retention-days: 2

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run android:sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - run: gradle -p platform/android assembleDebug --no-daemon --stacktrace
      - name: Prepare installable Android APK
        run: |
          mkdir -p platform/android/release-assets
          cp platform/android/app/build/outputs/apk/debug/app-debug.apk \
            platform/android/release-assets/LumaPet-${{ env.TAG_NAME }}-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: platform/android/release-assets/*.apk
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release-assets/android
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$REPOSITORY" --target "$GITHUB_SHA" --title "LumaPet $TAG_NAME" --generate-notes
          fi
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find release-assets/windows release-assets/android -mindepth 1 -maxdepth 1 -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release files were found" >&2
            exit 1
          fi
          printf 'Uploading %s release files\n' "${#assets[@]}"
          gh release upload "$TAG_NAME" "${assets[@]}" --repo "$REPOSITORY" --clobber
